# padcursor settings. Restart padcursor after changing them:
#   Linux: systemctl --user restart padcursor
#   macOS: choose Quit in the menu bar icon, then open Stickmouse again
#          (or change them in Settings, where changes apply right away)

# Pointer speed at full stick deflection, in pixels per second.
pointer_speed = 1400.0
# Speed multiplier for precise mode.
precise_factor = 0.3
# Scroll speed at full stick deflection. 120 units is one wheel notch.
scroll_speed = 1800.0
# How far a stick must move before it counts, from 0.0 to 1.0.
stick_deadzone = 0.12
# Higher values give finer control near the centre of the stick.
stick_curve = 2.0
# Size of the steering circle compared to a normal cursor.
circle_scale = 1.5
# What each stick does: "pointer", "scroll" or "none".
left_stick = "pointer"
right_stick = "scroll"

# How long to hold a button before its hold action happens instead of its press action.
hold_ms = 400
# How long to hold the Xbox button to turn padcursor on or off.
xbox_hold_ms = 1000
# How long after the last app switcher press the selected app is chosen.
alt_tab_commit_ms = 800
# How long after the stick stops the circle goes back to the normal cursor.
steering_idle_ms = 1000
# Volume repeat while a button is held: delay before repeating, then the repeat interval.
volume_delay_ms = 400
volume_repeat_ms = 150

[buttons]
# What each part of the controller does when pressed, and optionally when held (<name>_hold).
# Actions: left-click, right-click, middle-click, precise-mode, app-switcher, launcher,
# mission-control, on-screen-keyboard, play-pause, next-track, previous-track, volume-up,
# volume-down, mute, none, or a key or shortcut such as "escape", "enter", "f5", "cmd+w" or
# "ctrl+shift+t" (modifiers: ctrl, alt, shift, cmd).
# Holding the Xbox button always turns padcursor on or off; xbox sets what a short press does.
