[package]
name = "padcursor"
version = "0.1.0"
edition = "2024"
description = "Use an Xbox controller as a mouse and media remote on KDE Plasma and macOS"
license = "MIT"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
signal-hook = "0.4"
toml = "1"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
ksni = { version = "0.3", features = ["blocking"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-haptics = "0.3"
objc2-foundation = "0.3"
objc2-game-controller = { version = "0.3", features = ["objc2-core-haptics"] }
objc2-quartz-core = "0.3"

[profile.release]
lto = "thin"
strip = true
